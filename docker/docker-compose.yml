  ## port expose o local
services:
  # fatsapi application
  fastapi:
    build: 
      context: ..
      dockerfile: ./docker/rag/Dockerfile
    container_name: fastapi
    ports:
      - "8000:8000"
    env_file:
      - ./env/.env.app
    volumes:
        - fastapi_data:/app/assets
    restart: always
    networks:
      - backend
    depends_on:
      pgvector:
        condition: service_healthy
    
  pgvector:
    image: pgvector/pgvector:pg17-trixie
    container_name: pgvector
    ports:
      - "5433:5432"
    env_file:
      - ./env/.env.postgres
    volumes:
      - 'pgvector_data:/var/lib/postgresql/data'
    networks:
      - backend
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s

  #postgreSQL exporter for postgres metrics
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    env_file:
      - ./env/.env.postgres-exporter
    ports:
      - "9187:9187"
    networks:
      - backend
    restart: always
    depends_on:
      - pgvector

  #ngix
  nginx:
    image: nginx:stable-alpine3.24-perl
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - backend
    restart: always
    depends_on:
      - fastapi
  #postgresql(pgvector)
  #qdrant
  qdrant:
    image: qdrant/qdrant:v1.19
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    networks:
      - backend
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always

  #prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - 'prometheus_data:/prometheus'
      - './prometheus/prometheus.yml:/etc/prometheus/prometheus.yml'
    networks:
      - backend
    restart: always
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
  #grafana
  grafana:
    image: grafana/grafana:13.0.8
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - "grafana_data:/var/lib/grafana"
    env_file:
      - ./env/.env.grafana
    networks:
      - backend
    restart: always
    depends_on: 
      - prometheus


  #node exporter for system metrics
  # node-exporter:
  #   image: prom/node-exporter:latest
  #   container_name: node-exporter
  #   ports:
  #     - "9100:9100"
  #   volumes:
  #     - /proc:/host/proc:ro
  #     - /sys:/host/sys:ro
  #     - /:/rootfs:ro
  #   command:
  #     - '--path.procfs=/host/proc'
  #     - '--path.rootfs=/rootfs'
  #     - '--path.sysfs=/host/sys'
  #     - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
  #   networks:
  #     - backend
  #   restart: always

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter

    ports:
      - "9100:9100"

    pid: host

    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'

      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|mnt|tmp)($$|/)'

      - '--no-collector.netstat'
      - '--no-collector.softnet'

    networks:
      - backend

    restart: always



networks:
  backend:
    driver: bridge
volumes:
  fastapi_data:
  pgvector_data:
  qdrant_data:
  prometheus_data:
  grafana_data: