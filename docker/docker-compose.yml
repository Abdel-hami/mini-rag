services:
  ## port expose o local
  pgvector:
    image: pgvector/pgvector:pg18-trixie
    container_name: pgvector
    ports:
      - "5433:5432"
    env_file:
      - ./env/.env.postgres
    volumes:
      - 'pgvector_data:/var/lib/postgresql/data'
    networks:
      - backend
    restart: always
    healthcheck:
      test: ["CMD_shell", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s

  #postgreSQL exporter for postgres metrics
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    env_file:
      - ./env/.env.postgres-exporter
    ports:
      - "9187:9187"
    networks:
      - backend
    restart: always
    depends_on:
      - pgvector
  # fatsapi application

  #ngix
  #postgresql(pgvector)
  #qdrant
  qdrant:
    image: qdrant/qdrant:v1.19
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    networks:
      - backend
    volumes:
      - qdrant_data:/qdrant/storage
    env_file:
      - ./env/.env.qdrant
    restart: always

  #prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
    networks:
      - backend
    restart: always
  #grafana
  #node exporter for system metrics